<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Garden — Economias e Compras</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/economias.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
    <div class="app-shell">
        <header class="app-header">
            <div class="header-logo">
                <span class="logo-icon">NG</span>
                <div class="header-title">
                    <h1>New Garden</h1>
                    <p class="header-subtitle">Apto 1409 • Controle</p>
                </div>
            </div>
            <div class="header-actions">
                <button id="btnTema" class="btn-icon" aria-label="Alternar tema" title="Alternar tema claro/escuro">
                    <svg class="icon-sun" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="5"/>
                        <line x1="12" y1="1" x2="12" y2="3"/>
                        <line x1="12" y1="21" x2="12" y2="23"/>
                        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
                        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
                        <line x1="1" y1="12" x2="3" y2="12"/>
                        <line x1="21" y1="12" x2="23" y2="12"/>
                        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
                        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
                    </svg>
                </button>
            </div>
        </header>

        <main class="app-main">
            <section class="page-content active" id="page-economias">
                <div class="page-heading">
                    <h2>Planejamento de Compras (Enxoval)</h2>
                </div>

                <div class="cards-grid">
                    <div class="card card-stat" data-accent="green">
                        <div class="card-label">Valor Total Guardado</div>
                        <div class="card-value" id="totalGuardadoEconomias">R$ 0,00</div>
                    </div>
                    <div class="card card-stat" data-accent="yellow">
                        <div class="card-label">Valor Balão (2026)</div>
                        <div class="card-value" id="valorBalao2026">R$ 0,00</div>
                    </div>
                </div>

                <div class="card">
                    <div class="card-title-row">
                        <div class="card-title">Valores Guardados</div>
                        <button class="btn btn-primary" id="btnNovaEconomia">+ Guardar Valor</button>
                    </div>
                    <div class="table-wrapper">
                        <table class="data-table" id="tabelaEconomias">
                            <thead>
                                <tr>
                                    <th>Valor Guardado</th>
                                    <th>Data</th>
                                    <th>Observação</th>
                                </tr>
                            </thead>
                            <tbody id="corpoTabelaEconomias">
                            </tbody>
                        </table>
                    </div>
                </div>

                <div class="card">
                    <div class="card-title-row">
                        <div class="card-title">Itens para Compra</div>
                        <button class="btn btn-primary" id="btnNovoItem">+ Novo Item</button>
                    </div>
                    <div class="items-grid" id="gridItens">
                    </div>
                </div>
            </section>
        </main>

        <nav class="bottom-nav">
            <a href="index.html" class="nav-item">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="3" y="3" width="7" height="9"/>
                    <rect x="14" y="3" width="7" height="5"/>
                    <rect x="14" y="12" width="7" height="9"/>
                    <rect x="3" y="16" width="7" height="5"/>
                </svg>
                <span>Resumo</span>
            </a>
            <a href="pagamentos.html" class="nav-item">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="12" y1="1" x2="12" y2="23"/>
                    <path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>
                </svg>
                <span>Contabilidade</span>
            </a>
            <a href="economias.html" class="nav-item active">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21 2v6h-6"/><path d="M3 12a9 9 0 0 1 15-6.7L21 8"/>
                    <path d="M3 22v-6h6"/><path d="M21 12a9 9 0 0 1-15 6.7L3 16"/>
                </svg>
                <span>Economias</span>
            </a>
            <a href="mensal.html" class="nav-item">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
                    <line x1="16" y1="2" x2="16" y2="6"/>
                    <line x1="8" y1="2" x2="8" y2="6"/>
                    <line x1="3" y1="10" x2="21" y2="10"/>
                </svg>
                <span>Mensal</span>
            </a>
            <a href="importacao.html" class="nav-item">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                    <polyline points="17 8 12 3 7 8"/>
                    <line x1="12" y1="3" x2="12" y2="15"/>
                </svg>
                <span>Importar</span>
            </a>
        </nav>
    </div>

    <!-- Modal Nova Economia -->
    <div class="modal-overlay" id="modalEconomia">
        <div class="modal">
            <div class="modal-header">
                <h3>Guardar Valor</h3>
                <button class="btn-close" data-fechar-modal>&times;</button>
            </div>
            <form id="formEconomia">
                <div class="form-group">
                    <label for="ecoValor">Valor Guardado</label>
                    <input type="number" id="ecoValor" step="0.01" min="0" required>
                </div>
                <div class="form-group">
                    <label for="ecoData">Data</label>
                    <input type="date" id="ecoData" required>
                </div>
                <div class="form-group">
                    <label for="ecoObservacao">Observação</label>
                    <input type="text" id="ecoObservacao">
                </div>
                <div class="form-actions">
                    <button type="button" class="btn btn-secondary" data-fechar-modal>Cancelar</button>
                    <button type="submit" class="btn btn-primary">Salvar</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal Novo Item -->
    <div class="modal-overlay" id="modalItem">
        <div class="modal">
            <div class="modal-header">
                <h3>Novo Item para Compra</h3>
                <button class="btn-close" data-fechar-modal>&times;</button>
            </div>
            <form id="formItem">
                <div class="form-group">
                    <label for="itemNome">Nome do Item</label>
                    <input type="text" id="itemNome" required>
                </div>
                <div class="form-group">
                    <label for="itemValorEstimado">Valor Estimado</label>
                    <input type="number" id="itemValorEstimado" step="0.01" min="0" required>
                </div>
                <div class="form-group">
                    <label for="itemValorGuardado">Valor Já Acumulado</label>
                    <input type="number" id="itemValorGuardado" step="0.01" min="0" value="0">
                </div>
                <div class="form-group">
                    <label for="itemStatus">Status</label>
                    <select id="itemStatus">
                        <option value="em_andamento">Em andamento</option>
                        <option value="concluido">Concluído</option>
                    </select>
                </div>
                <div class="form-actions">
                    <button type="button" class="btn btn-secondary" data-fechar-modal>Cancelar</button>
                    <button type="submit" class="btn btn-primary">Salvar</button>
                </div>
            </form>
        </div>
    </div>

    <script src="data/dados-iniciais.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/calculos.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/app.js"></script>
    <script src="js/economias.js"></script>
</body>
</html>
